group = "com.example.screen_share_plugin"
version = "1.0-SNAPSHOT"

// Kept in Groovy so the same file works in host apps on AGP 8.x (which need
// the Kotlin Gradle plugin applied) and on AGP 9+ (which compiles Kotlin
// itself and rejects the separate plugin).
buildscript {
    ext.kotlin_version = "2.1.0"
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.7.3")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

// AGP 9+ compiles Kotlin itself unless the app opts out with
// `android.builtInKotlin=false` (Flutter's app template does). In every other
// case the Kotlin Gradle plugin has to be applied here.
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0].toInteger()
def builtInKotlin = agpMajor >= 9 &&
        (findProperty("android.builtInKotlin")?.toString() ?: "true").toBoolean()
if (!builtInKotlin) {
    apply plugin: "kotlin-android"
}

android {
    namespace = "com.example.screen_share_plugin"
    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        // Android 5.0. Apps built with Flutter 3.35+ start at API 24 anyway;
        // the native code below guards every newer API by version.
        minSdk = 21
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()
        }
    }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
}

dependencies {
    implementation("androidx.core:core:1.13.1")
    testImplementation("org.jetbrains.kotlin:kotlin-test")
    testImplementation("org.mockito:mockito-core:5.0.0")
}
