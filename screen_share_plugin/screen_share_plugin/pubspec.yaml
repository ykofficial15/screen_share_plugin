name: screen_share_plugin
description: "Cross-platform screen sharing for Flutter (Android, iOS, macOS, Windows, Linux and Web) built on flutter_webrtc, with Android foreground-service handling for every Android version."
version: 1.0.0
homepage: https://github.com/ykofficial15/screen_share_plugin
repository: https://github.com/ykofficial15/screen_share_plugin

topics:
  - screen-share
  - webrtc
  - screen-capture

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_webrtc: ">=1.2.0 <2.0.0"
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      # Android needs native code: a foreground service of type
      # "mediaProjection" is mandatory for screen capture on Android 10+.
      android:
        package: com.example.screen_share_plugin
        pluginClass: ScreenSharePlugin
      # The remaining platforms are pure Dart: capture itself is done by
      # flutter_webrtc, which ships the native code for each of them.
      ios:
        dartPluginClass: ScreenSharePluginDesktopAndIos
      macos:
        dartPluginClass: ScreenSharePluginDesktopAndIos
      windows:
        dartPluginClass: ScreenSharePluginDesktopAndIos
      linux:
        dartPluginClass: ScreenSharePluginDesktopAndIos
      web:
        pluginClass: ScreenSharePluginWeb
        fileName: src/screen_share_plugin_web.dart
